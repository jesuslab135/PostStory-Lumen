<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Cordis - Plantilla Azul (Dark Mode)</title>
    
    <!-- Tailwind CSS para la UI de las herramientas externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para la exportación a PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Fuentes de Google: Playfair Display (Frase) y Montserrat (Autor) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos del entorno de trabajo exterior */
        body {
            background-color: #0f172a; /* Fondo muy oscuro para el espacio de trabajo */
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #workspace {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: hidden;
        }

        /* 
           EL LIENZO (CANVAS) - Medidas exactas Instagram Vertical
        */
        .lumen-canvas {
            width: 1080px;
            height: 1350px;
            background-color: #162A43; /* Azul Marino Oscuro Institucional */
            position: relative;
            transform-origin: center center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            overflow: hidden;
        }

        /* Imagen de fondo (Santo/Virgen) al lado derecho */
        .lumen-bg-image {
            position: absolute;
            top: 0;
            right: 0;
            width: 80%; /* Ocupa el 80% derecho */
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
            opacity: 0.45; /* Aumentado al 45% para que sea muy visible */
            z-index: 1;
            transform: scale(1);
            transition: transform 0.1s ease-out, object-position 0.1s ease-out;
        }

        /* Gradiente Azul Marino para fundir la imagen con el color base */
        .lumen-bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Ajustado para revelar más la imagen de la derecha */
            background: linear-gradient(to right, #162A43 35%, rgba(22, 42, 67, 0.8) 60%, transparent 100%);
            z-index: 2;
        }

        /* Logotipo protegido con fondo blanco circular */
        .lumen-logo {
            position: absolute;
            top: 80px;
            left: 80px;
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
            background-color: #FFFFFF;
            padding: 8px; /* Espacio de protección para que el logo respire */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* Franja inferior corporativa (3 colores) */
        .lumen-strip {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            display: flex;
            z-index: 10;
        }
        .strip-blue { width: 33.33%; background-color: #2A75B3; } /* Azul claro */
        .strip-red { width: 33.33%; background-color: #BE1E2D; } /* Rojo carmesí */
        .strip-yellow { width: 33.34%; background-color: #E9B439; } /* Amarillo dorado */

        /* Contenedor central magnético */
        .lumen-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 12px; /* Restamos la franja de abajo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 160px; /* Margen innegociable a los lados */
            z-index: 10;
        }

        /* Frase del Santo (Off-White para contraste máximo) */
        .lumen-quote {
            font-family: 'Playfair Display', serif;
            font-size: 64px;
            line-height: 1.35;
            color: #FAFAFA; /* Off-White en lugar de blanco puro */
            text-align: center;
            outline: none;
            margin-bottom: 40px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3); /* Sombra suave para asegurar legibilidad */
        }

        /* Separador minimalista Rojo */
        .lumen-divider {
            width: 60px;
            height: 3px;
            background-color: #BE1E2D; /* Rojo Carmesí */
            margin-bottom: 40px;
        }

        /* Nombre del Autor (Amarillo Dorado) */
        .lumen-author {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #E9B439; /* Amarillo Dorado */
            text-align: center;
            outline: none;
        }

        /* Efecto al pasar el cursor sobre texto editable */
        [contenteditable="true"]:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: text;
        }
    </style>
</head>
<body>

    <!-- Barra de herramientas superior -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center z-20 relative">
        <div>
            <h1 class="text-xl font-semibold tracking-wide flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#162A43] border border-gray-600"></span>
                Lumen Cordis
            </h1>
            <p class="text-xs text-gray-400 mt-1">Generador: Plantilla Azul + Imagen Fondo</p>
        </div>
        <div class="flex gap-3 items-center">
            <!-- Input Oculto para cargar archivo -->
            <input type="file" id="imageUploader" accept="image/*" class="hidden">
            
            <!-- Controles de Imagen (Zoom, X, Y) -->
            <div class="flex items-center gap-1 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-600 shadow-sm" id="imageControls">
                <span class="text-xs text-gray-300" title="Zoom">🔍</span>
                <input type="range" id="zoomSlider" min="0.5" max="3" value="1" step="0.05" class="w-16 accent-[#2A75B3]">
                
                <span class="text-xs text-gray-300 ml-2" title="Mover Horizontal">↔️</span>
                <input type="range" id="posXSlider" min="0" max="100" value="50" class="w-16 accent-[#2A75B3]">
                
                <span class="text-xs text-gray-300 ml-2" title="Mover Vertical">↕️</span>
                <input type="range" id="posYSlider" min="0" max="100" value="20" class="w-16 accent-[#2A75B3]">
            </div>

            <!-- Selector de Formato (NUEVO) -->
            <select id="formatSelector" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm border border-gray-600 shadow-sm outline-none cursor-pointer">
                <option value="post">Formato Post (4:5)</option>
                <option value="story">Formato Historia (9:16)</option>
            </select>

            <button onclick="document.getElementById('imageUploader').click()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm transition-colors border border-gray-600 shadow-sm flex items-center gap-2">
                <span>📷</span> Cambiar Fondo
            </button>
            <button onclick="downloadPost()" class="bg-[#2A75B3] hover:bg-[#1f598a] text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors shadow-md flex items-center gap-2">
                <span>⬇️</span> Descargar Post
            </button>
        </div>
    </header>

    <!-- Espacio de trabajo central -->
    <main id="workspace">
        <!-- Contenedor que será exportado a PNG -->
        <div class="lumen-canvas" id="canvas">
            
            <!-- Imagen de fondo por defecto (Cristo/Santo) -->
            <!-- Cambié la imagen por un vitral luminoso para asegurar que resalte en las pruebas -->
            <img src="https://images.unsplash.com/photo-1548625361-ec853c09b626?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80" id="bgImageElement" class="lumen-bg-image" alt="Fondo Santo" crossorigin="anonymous">
            
            <!-- Gradiente que tapa la mitad izquierda y funde la foto hacia el azul marino -->
            <div class="lumen-bg-gradient"></div>

            <!-- Logotipo circular -->
            <img src="lumen.jpeg" alt="Lumen Cordis Logo" class="lumen-logo" onerror="this.onerror=null; this.src='https://placehold.co/140x140/FFFFFF/162A43?text=LC';">

            <!-- Zona de textos -->
            <div class="lumen-content">
                <div class="lumen-quote" contenteditable="true" spellcheck="false">
                    Me veo tan débil que si no tuviera la Santa Comunión caería continuamente; una sola cosa me sostiene y esto es la Santa Comunión. De ella tomo fuerza, en ella está mi fortaleza.
                </div>
                
                <div class="lumen-divider"></div>
                
                <div class="lumen-author" contenteditable="true" spellcheck="false">
                    Santa Faustina Kowlaska
                </div>
            </div>

            <!-- Franja Corporativa Inferior -->
            <div class="lumen-strip">
                <div class="strip-blue"></div>
                <div class="strip-red"></div>
                <div class="strip-yellow"></div>
            </div>

        </div>
    </main>

    <script>
        // Variables de dimensiones actuales (NUEVO)
        let currentCanvasWidth = 1080;
        let currentCanvasHeight = 1350;

        /**
         * Ajusta el zoom visual del lienzo para que quepa en la ventana, 
         * sin modificar sus medidas reales.
         */
        function resizeCanvas() {
            const workspace = document.getElementById('workspace');
            const canvas = document.getElementById('canvas');
            
            const availableWidth = workspace.clientWidth - 64;
            const availableHeight = workspace.clientHeight - 64;
            
            // Actualizado para usar las variables dinámicas
            const scaleWidth = availableWidth / currentCanvasWidth;
            const scaleHeight = availableHeight / currentCanvasHeight;
            
            const scale = Math.min(scaleWidth, scaleHeight, 1);
            
            canvas.style.transform = `scale(${scale})`;
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        
        // Limpiador de texto para evitar pegar estilos extraños o comillas tipográficas
        document.querySelectorAll('[contenteditable="true"]').forEach(el => {
            el.addEventListener('paste', function(e) {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                const cleanText = text.replace(/["“”«»]/g, '');
                document.execCommand('insertText', false, cleanText);
            });
        });

        // LÓGICA: Cambiar imagen de fondo
        const imageUploader = document.getElementById('imageUploader');
        const bgImageElement = document.getElementById('bgImageElement');
        const zoomSlider = document.getElementById('zoomSlider');
        const posXSlider = document.getElementById('posXSlider');
        const posYSlider = document.getElementById('posYSlider');

        // Función para actualizar escala y posición
        function updateImageTransform() {
            const scale = zoomSlider.value;
            const x = posXSlider.value;
            const y = posYSlider.value;
            bgImageElement.style.transform = `scale(${scale})`;
            bgImageElement.style.objectPosition = `${x}% ${y}%`;
        }

        zoomSlider.addEventListener('input', updateImageTransform);
        posXSlider.addEventListener('input', updateImageTransform);
        posYSlider.addEventListener('input', updateImageTransform);

        // LÓGICA: Cambiar Formato (Post vs Historia) (NUEVO)
        document.getElementById('formatSelector').addEventListener('change', function(e) {
            const canvas = document.getElementById('canvas');
            if (e.target.value === 'story') {
                currentCanvasWidth = 1080;
                currentCanvasHeight = 1920; // Altura de Instagram Story
            } else {
                currentCanvasWidth = 1080;
                currentCanvasHeight = 1350; // Altura de Instagram Post
            }
            canvas.style.width = currentCanvasWidth + 'px';
            canvas.style.height = currentCanvasHeight + 'px';
            resizeCanvas(); // Re-escalar para la vista previa
        });

        imageUploader.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Reemplazamos la ruta de la imagen con la foto subida en Base64
                    bgImageElement.src = e.target.result;
                    // Removemos el atributo de seguridad crossorigin al ser archivo local
                    bgImageElement.removeAttribute('crossorigin');
                    
                    // Reiniciar sliders al cargar nueva imagen para que quede centrada
                    zoomSlider.value = 1;
                    posXSlider.value = 50;
                    posYSlider.value = 50;
                    updateImageTransform();
                }
                reader.readAsDataURL(file);
            }
        });

        // LÓGICA: Exportar Lienzo a PNG sin pixelar
        function downloadPost() {
            const canvasElement = document.getElementById('canvas');
            const originalTransform = canvasElement.style.transform;
            
            // Revertir escala temporalmente a tamaño completo para tomar la foto HD
            canvasElement.style.transform = 'scale(1)';
            
            // html2canvas hace la captura matemática
            html2canvas(canvasElement, {
                width: currentCanvasWidth,    // Modificado para ajustarse al formato elegido
                height: currentCanvasHeight,  // Modificado para ajustarse al formato elegido
                scale: 1, 
                useCORS: true,
                backgroundColor: '#162A43',
                logging: false
            }).then(canvas => {
                // Restaurar vista previa
                canvasElement.style.transform = originalTransform;
                
                // Forzar descarga
                const link = document.createElement('a');
                link.download = 'Lumen-Cordis-Post-Azul.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>

</body>
</html>
